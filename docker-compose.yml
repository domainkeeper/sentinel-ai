services:
  sentinel:
    build: .
    image: sentinel-ai:latest
    container_name: sentinel-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # SQLite file inside the container, backed by the named volume below.
      DATABASE_PATH: /app/data/sentinel.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      DISCOVERY_RSS_FEEDS: ${DISCOVERY_RSS_FEEDS:-}
      DISCOVERY_HTTP_TIMEOUT_MS: ${DISCOVERY_HTTP_TIMEOUT_MS:-15000}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-3600}
    volumes:
      # Persistent named volume — this is what keeps the SQLite DB alive
      # across container recreation/redeploys. Without it, data resets.
      - sentinel-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel-data:
